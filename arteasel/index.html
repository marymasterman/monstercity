<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Art Easel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: a sheet of paper on the left fills the height; a supply tray on the right (it stacks below on phones). */
:root{
  --desk:#cfe0d8;           /* felt desk mat */
  --desk-deep:#b9cfc5;
  --tray:#fffaf0;           /* warm card tray */
  --tray-edge:#e4d9c3;
  --btn:#ffffff;
  --ink:#27303a;
  --muted:#6b7580;
  --accent:#ffd23f;         /* sticker yellow marks what's picked */
  --accent-ink:#3a2e00;
  --danger:#e4553f;
  --book:#2b5fd0;
  --book-spine:#1e45a0;
  --book-ink:#ffffff;
  --paper:#ffffff;          /* paper stays white in both themes */
  --shadow:0 10px 30px rgba(20,40,35,.18);
  --font-ui:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --font-hand:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  --current:#2f6fe4;        /* the colour currently picked; tints the tool tips */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1d2a2a; --desk-deep:#152020; --tray:#2b3238; --tray-edge:#3d474f; --btn:#39424a;
    --ink:#f2eee6; --muted:#a7afb7; --accent:#ffd23f; --accent-ink:#3a2e00; --danger:#e4553f;
    --book:#3b6fe0; --book-spine:#2850b0; --book-ink:#ffffff; --paper:#ffffff;
    --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#1d2a2a; --desk-deep:#152020; --tray:#2b3238; --tray-edge:#3d474f; --btn:#39424a;
  --ink:#f2eee6; --muted:#a7afb7; --accent:#ffd23f; --accent-ink:#3a2e00; --danger:#e4553f;
  --book:#3b6fe0; --book-spine:#2850b0; --book-ink:#ffffff; --paper:#ffffff;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}

html{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
button{font-family:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.app{
  height:100%;display:flex;gap:14px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.stage{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.paperBox{flex:1 1 auto;min-height:0;min-width:0;container-type:size;display:grid;place-items:center}
.paper{
  position:relative;width:min(100cqw,calc(100cqh * 850 / 1100));max-width:100%;aspect-ratio:850/1100;
  background:var(--paper);border-radius:6px;box-shadow:var(--shadow);
  touch-action:none;cursor:crosshair;overflow:hidden;
}
.paper canvas,.paper svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.paper svg{pointer-events:none}
.paper.fillMode{cursor:cell}

.nameRow{display:flex;align-items:baseline;justify-content:center;gap:10px;font-family:var(--font-hand);font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.nameRow input{font:inherit;color:inherit;background:transparent;border:0;border-bottom:3px solid var(--ink);border-radius:0;width:min(55vw,320px);padding:0 8px 2px;-webkit-user-select:text;user-select:text}
.nameRow input::placeholder{color:var(--muted);opacity:.8}

.tray{
  flex:0 0 204px;min-height:0;overflow-y:auto;
  background:var(--tray);border:1px solid var(--tray-edge);border-radius:18px;box-shadow:var(--shadow);
  padding:12px;display:flex;flex-direction:column;gap:12px;
}
.brand{margin:0;font:400 30px/1 var(--font-hand);text-align:center;letter-spacing:.01em}

.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tool{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:72px;
  border-radius:14px;border:2px solid transparent;background:transparent;color:var(--ink);
  font:600 13px/1 var(--font-ui);cursor:pointer;
}
.tool svg{width:44px;height:44px;display:block}
.tool .tip{fill:var(--current)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.tool.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;min-height:50px}
.tool.wide svg{width:38px;height:38px}

.markerPanel{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--desk);font:600 12px/1 var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.markerPanel input[type="range"]{width:100%;min-width:0;margin:0;height:30px;accent-color:var(--ink);background:transparent;cursor:pointer}
.markerPanel input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);border:3px solid var(--tray);margin-top:-10px}
.markerPanel input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--muted)}
.markerPanel input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--tray)}
.markerPanel input[type="range"]::-moz-range-track{height:6px;border-radius:3px;background:var(--muted)}
.markerPanel .previewWrap{grid-column:1/-1;height:40px;display:grid;place-items:center;background:var(--paper);border-radius:8px}
.markerPanel .preview{display:block;border-radius:50%;background:var(--current);width:30px;height:30px;opacity:.45}

.book{
  display:flex;align-items:center;gap:12px;padding:0;min-height:60px;border:0;border-radius:10px;
  background:var(--book);color:var(--book-ink);cursor:pointer;overflow:hidden;
  box-shadow:0 4px 0 var(--book-spine);
}
.book .spine{width:16px;align-self:stretch;background:var(--book-spine);border-right:2px solid rgba(255,255,255,.35)}
.book .word{font:400 32px/1 var(--font-hand);flex:1;text-align:left}
.book:active{transform:translateY(2px);box-shadow:0 2px 0 var(--book-spine)}

.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center}
.swatch{width:46px;height:46px;border-radius:50%;padding:0;cursor:pointer;background:var(--c);border:3px solid rgba(0,0,0,.14)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--tray),0 0 0 6px var(--ink)}
.rainbow{position:relative;background:conic-gradient(from 90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#00c7be,#007aff,#5856d6,#ff2d55,#ff3b30)}
.rainbow::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--tray);border:2px solid rgba(0,0,0,.12)}
.rainbow[aria-pressed="true"]::after{background:var(--current)}
.hueGrid,.grayRow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.grayRow{grid-template-columns:repeat(8,minmax(0,1fr));margin-top:10px}
.hueGrid button,.grayRow button{aspect-ratio:1;min-width:0;padding:0;border-radius:10px;border:2px solid rgba(0,0,0,.12);background:var(--c);cursor:pointer}
.hueGrid button[aria-pressed="true"],.grayRow button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--tray),0 0 0 6px var(--ink)}
.mix{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;width:100%}
.mix input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.mix .dot{width:22px;height:22px;border-radius:50%;background:var(--current);border:2px solid rgba(0,0,0,.15)}

.actions,.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.btn{
  font:600 16px/1 var(--font-ui);min-height:46px;padding:8px 10px;border-radius:12px;
  border:2px solid var(--ink);background:var(--btn);color:var(--ink);cursor:pointer;
}
.btn:disabled{opacity:.35;cursor:default}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.saveWrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.saveWrap .btn{width:100%}
.switch{display:inline-flex;gap:2px;padding:2px;border-radius:999px;border:2px solid var(--ink);background:var(--btn);cursor:pointer;font:600 11px/1 var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.switch .k{padding:5px 8px;border-radius:999px}
.switch[aria-pressed="true"] .on{background:var(--accent);color:var(--accent-ink)}
.switch[aria-pressed="false"] .off{background:var(--muted);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,25,25,.55);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:760px;max-height:92%;overflow:auto;background:var(--tray);color:var(--ink);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheetHead h2{margin:0;font:400 32px/1 var(--font-hand)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.pageCard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;cursor:pointer;background:var(--btn);color:var(--ink);border:2px solid var(--tray-edge);border-radius:12px;font:600 14px/1 var(--font-ui)}
.pageCard .thumb{display:block;width:100%;aspect-ratio:850/1100;background:#fff;border:1px solid #d9d9d9;border-radius:6px;overflow:hidden}
.pageCard .thumb svg{width:100%;height:100%;display:block}
.pageCard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.ask{background:var(--tray);color:var(--ink);border-radius:20px;padding:22px;max-width:380px;text-align:center;font:500 21px/1.3 var(--font-ui);box-shadow:var(--shadow);text-wrap:balance}
.ask .row{display:flex;gap:10px;justify-content:center;margin-top:18px}
.ask .btn{flex:1}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;pointer-events:none;background:var(--ink);color:var(--tray);padding:10px 18px;border-radius:999px;font:600 15px/1.25 var(--font-ui);opacity:0;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}

#printCanvas{display:none}
@media print{
  @page{margin:.4in}
  body{background:#fff;overflow:visible}
  .app,.overlay,#toast{display:none!important}
  #printCanvas{display:block;width:100%;height:auto;max-height:100vh;object-fit:contain}
}

@media (max-width:700px){
  .app{flex-direction:column;gap:10px}
  .tray{flex:0 0 auto;overflow:visible;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:10px}
  .brand{display:none}
  .tools{grid-template-columns:repeat(5,60px);gap:4px}
  .tool{min-height:64px;padding:4px 2px}
  .tool svg{width:36px;height:36px}
  .tool.wide{grid-column:auto;flex-direction:column;gap:2px;min-height:64px}
  .tool.wide svg{width:36px;height:36px}
  .markerPanel{width:300px;max-width:100%}
  .book{min-height:56px;width:120px}
  .colors{grid-template-columns:repeat(6,40px);gap:6px}
  .hueGrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .swatch{width:40px;height:40px}
  .actions,.bottom{grid-template-columns:auto auto}
  .nameRow{font-size:20px}
  .nameRow input{width:50vw}
}
</style>

<div class="app">
  <main class="stage">

        Fill
      </button>
    </div>

    <div class="markerPanel" id="markerPanel" hidden>
      <label for="markerW">Size</label><input type="range" id="markerW" min="8" max="64" step="1" value="30" aria-label="Marker size">

      <span class="spine" aria-hidden="true"></span>

<div class="overlay" id="colorWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="colorTitle">
    <div class="sheetHead">
      <h2 id="colorTitle">Pick a color</h2>

<script>
(() => {
'use strict';
const W = 850, H = 1100, S = 2;
const KEY = 'arteasel.v1';
const TOOLS = {
  pencil: { w: 3,  a: 0.85 },
  pen:    { w: 7,  a: 1 },
  marker: { w: 30, a: 0.45 },
  eraser: { w: 46, a: 1 },
  fill:   { w: 0,  a: 1 }
};
const COLORS = [
  ['Black', '#222222'], ['Brown', '#8b5a2b'], ['Red', '#e63946'],
  ['Orange', '#f4820b'], ['Yellow', '#ffd23f'], ['Green', '#2fa84f'],
  ['Sky blue', '#6cc3f5'], ['Blue', '#2f6fe4'],
  ['Purple', '#8b4fd8'], ['Pink', '#ff7ab8'], ['Peach', '#f6c9a8']
];

/* ---------- coloring-book pages (original line art, 850 x 1100) ---------- */
const f1 = n => (Math.round(n * 10) / 10).toString();
function star(cx, cy, R, r, n) {
  n = n || 5;
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R;
    pts.push(f1(cx + rad * Math.cos(a)) + ',' + f1(cy + rad * Math.sin(a)));
  }
  return '<polygon points="' + pts.join(' ') + '"/>';
}
function sun(cx, cy, r) {
  let s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    s += '<line x1="' + f1(cx + Math.cos(a) * (r + 20)) + '" y1="' + f1(cy + Math.sin(a) * (r + 20)) +
         '" x2="' + f1(cx + Math.cos(a) * (r + 50)) + '" y2="' + f1(cy + Math.sin(a) * (r + 50)) + '"/>';
  }
  return s;
}
function cloud(x, y, k) {
  return '<path transform="translate(' + x + ' ' + y + ') scale(' + (k || 1) + ')" d="M0,40 C-25,40 -30,10 -5,5 C-5,-25 40,-30 55,-10 C65,-40 120,-35 120,0 C145,0 145,40 120,40 Z"/>';
}
function petals(cx, cy, n, dist, radial, tang) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const deg = i * 360 / n, a = deg * Math.PI / 180;
    const x = f1(cx + dist * Math.cos(a)), y = f1(cy + dist * Math.sin(a));
    s += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + radial + '" ry="' + tang + '" transform="rotate(' + deg + ' ' + x + ' ' + y + ')"/>';
  }
  return s;
}
const PAGES = [
  { id: 'blank', name: 'Blank paper', svg: '' },
  { id: 'cat', name: 'Cat', svg:
    '<circle cx="425" cy="380" r="150"/>' +
    '<path d="M319,274 L260,120 L404,232 M531,274 L590,120 L446,232"/>' +
    '<path d="M330,255 L292,160 L390,228 M520,255 L558,160 L460,228"/>' +
    '<circle cx="370" cy="370" r="24"/><circle cx="480" cy="370" r="24"/>' +
    '<circle cx="375" cy="372" r="9" fill="#1b1b1b"/><circle cx="485" cy="372" r="9" fill="#1b1b1b"/>' +

  earthRow.appendChild(b);
});
['#ffffff', '#e6e6e6', '#c9c9c9', '#a3a3a3', '#7a7a7a', '#4d4d4d', '#262626', '#000000'].forEach((c, i) => {
  const b = swatchButton(c, ['white', 'very light gray', 'light gray', 'gray', 'medium gray', 'dark gray', 'very dark gray', 'black'][i], '');
  b.addEventListener('click', () => { setColor(c); colorWrap.hidden = true; });
  grayRow.appendChild(b);
});
mixColor.addEventListener('input', () => { if (HEX.test(mixColor.value)) setColor(mixColor.value); });
mixColor.addEventListener('change', () => { if (HEX.test(mixColor.value)) { setColor(mixColor.value); colorWrap.hidden = true; } });
colorClose.addEventListener('click', () => { colorWrap.hidden = true; rainbowBtn.focus(); });
colorWrap.addEventListener('click', e => { if (e.target === colorWrap) colorWrap.hidden = true; });

/* ---------- coloring book ---------- */
function setPage(id, clear) {
  const pg = PAGES.find(p => p.id === id) || PAGES[0];
  state.page = pg.id;
  lines.innerHTML = pg.svg;
  for (const b of pagesEl.children) b.setAttribute('aria-pressed', String(b.dataset.id === pg.id));
  if (clear) { strokes = []; redrawAll(); }
  if (pg.svg) {
    pageReady = new Promise(res => {
      const img = new Image();
      img.onload = () => { pageImg = img; try { lineMask = buildLineMask(img); } catch (err) { lineMask = null; } res(); };
      img.onerror = () => { pageImg = null; lineMask = null; res(); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(lines));
    });
  } else { pageImg = null; lineMask = null; pageReady = Promise.resolve(); }
  persist();
}
for (const pg of PAGES) {
  const b = document.createElement('button');
  b.className = 'pageCard'; b.type = 'button'; b.dataset.id = pg.id; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<span class="thumb">' + (pg.svg ? wrapSvg(pg.svg, 12) : '') + '</span><span>' + pg.name + '</span>';
  b.addEventListener('click', async () => {
    bookWrap.hidden = true;
    if (pg.id === state.page && strokes.length === 0) return;
    if (strokes.length) {
      const ok = await ask(pg.id === 'blank' ? 'Start a fresh sheet? Your drawing will go away.' : 'Start the ' + pg.name.toLowerCase() + ' page? Your drawing will go away.', 'Yes');
      if (!ok) return;
    }
    setPage(pg.id, true);
    toast(pg.id === 'blank' ? 'Fresh sheet of paper' : pg.name + ' page');
  });
  pagesEl.appendChild(b);
}
bookBtn.addEventListener('click', () => { bookWrap.hidden = false; bookClose.focus(); });
bookClose.addEventListener('click', () => { bookWrap.hidden = true; bookBtn.focus(); });
bookWrap.addEventListener('click', e => { if (e.target === bookWrap) bookWrap.hidden = true; });

/* ---------- ask / toast ---------- */
function ask(msg, yesLabel) {
  return new Promise(res => {
    askMsg.textContent = msg; askYes.textContent = yesLabel || 'Yes';
    askWrap.hidden = false;
    const done = v => { askWrap.hidden = true; askYes.onclick = askNo.onclick = null; res(v); };
    askYes.onclick = () => done(true);
    askNo.onclick = () => done(false);
    askNo.focus();
  });
}
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { bookWrap.hidden = true; colorWrap.hidden = true; if (!askWrap.hidden) askNo.click(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && document.activeElement !== artist) { e.preventDefault(); undo(); }
});

/* ---------- undo / delete ---------- */
function undo() { if (!strokes.length) return; strokes.pop(); redrawAll(); persist(); }
undoBtn.addEventListener('click', undo);
clearBtn.addEventListener('click', async () => {
  if (!strokes.length) { toast('The paper is already clean'); return; }
  if (await ask('Erase everything?', 'Yes, erase')) { strokes = []; redrawAll(); persist(); toast('All clean'); }
});

/* ---------- name ---------- */
artist.addEventListener('input', () => { state.name = artist.value; persistSoon(); });

/* ---------- save / print ---------- */
async function makeComposite() {
  await pageReady;
  try { await document.fonts.load('38px "Patrick Hand"'); } catch (err) {}
  const strip = 90;
  const c = document.createElement('canvas');
  c.width = PW; c.height = (H + strip) * S;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(draw, 0, 0);
  if (pageImg) x.drawImage(pageImg, 0, 0, PW, PH);
  x.setTransform(S, 0, 0, S, 0, 0);
  x.fillStyle = '#27303a';
  x.font = '38px "Patrick Hand", "Chalkboard SE", "Comic Sans MS", cursive';
  x.textBaseline = 'alphabetic';
  x.fillText('Name', 50, H + 58);
  x.strokeStyle = '#27303a'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(150, H + 64); x.lineTo(W - 50, H + 64); x.stroke();
  const nm = (state.name || '').trim();
  if (nm) x.fillText(nm, 166, H + 56);
  return c;
}
function safeName() {
  const nm = (state.name || '').trim().replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-');
  return (nm ? nm + '-' : '') + 'drawing.png';
}
saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true;
  try {
    const c = await makeComposite();
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (!blob) { toast("Couldn't make the picture"); return; }
    const filename = safeName();
    if (inViewer) {
      let dl = null;
      try { dl = await window.claude.use('downloads'); } catch (err) { dl = null; }
      if (!dl) { toast("Saving isn't available in this preview"); return; }
      try { await dl.save({ filename: filename, data: blob }); toast('Saved!'); }
      catch (err) { if (!err || err.code !== 'declined') toast("Couldn't save here"); }
      return;
    }
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Saved!');
  } finally { saveBtn.disabled = false; }
});
if (inViewer) printBtn.hidden = true;
printBtn.addEventListener('click', async () => {
  const c = await makeComposite();
  printCanvas.width = c.width; printCanvas.height = c.height;
  printCanvas.getContext('2d').drawImage(c, 0, 0);
  window.print();
});

/* ---------- remember (auto-save in this browser) ---------- */
function snapshot() {
  return { v: 1, tool: state.tool, color: state.color, page: state.page, name: state.name,
           markerW: state.markerW, markerA: state.markerA,
           strokes: strokes.map(s => {
             const o = { t: s.t, c: s.c, p: s.p };
             if (s.w != null) o.w = s.w;
             if (s.a != null) o.a = s.a;
             return o;
           }) };
}
function persist() {
  if (!state.remember) return;
  try { localStorage.setItem(KEY, JSON.stringify(snapshot())); } catch (err) {}
}
let persistTimer = 0;
function persistSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persist, 400); }
async function restore(d) {
  if (!d || typeof d !== 'object') return false;
  if (typeof d.color === 'string' && HEX.test(d.color)) state.color = d.color.toLowerCase();
  if (TOOLS[d.tool]) state.tool = d.tool;
  if (Number.isFinite(d.markerW)) state.markerW = Math.min(64, Math.max(8, d.markerW));
  if (Number.isFinite(d.markerA)) state.markerA = Math.min(100, Math.max(10, d.markerA));
  state.name = typeof d.name === 'string' ? d.name.slice(0, 30) : '';
  artist.value = state.name;
  strokes = Array.isArray(d.strokes)
    ? d.strokes.filter(s => s && TOOLS[s.t] && typeof s.c === 'string' && HEX.test(s.c) && Array.isArray(s.p) && s.p.length >= 2)
               .map(s => {
                 const o = { t: s.t, c: s.c, p: s.p.map(Number) };
                 if (Number.isFinite(s.w)) o.w = s.w;
                 if (Number.isFinite(s.a)) o.a = s.a;
                 return o;
               })
    : [];
  setPage(PAGES.some(p => p.id === d.page) ? d.page : 'blank', false);
  await pageReady;
  redrawAll();
  return true;
}
rememberBtn.addEventListener('click', () => {
  state.remember = !state.remember;
  rememberBtn.setAttribute('aria-pressed', String(state.remember));
  try {
    localStorage.setItem(KEY + '.remember', state.remember ? '1' : '0');
    if (!state.remember) localStorage.removeItem(KEY);
  } catch (err) {}
  if (state.remember) persist();
  toast(state.remember ? "I'll remember your drawing" : "I won't remember your drawing");
});

/* ---------- fit the paper when container units are missing ---------- */
if (!(window.CSS && CSS.supports && CSS.supports('width: 1cqh'))) {
  const fit = () => {
    const r = paperBox.getBoundingClientRect();
    const w = Math.max(80, Math.min(r.width, r.height * W / H));
    paper.style.width = w + 'px'; paper.style.height = (w * H / W) + 'px';
  };
  if (window.ResizeObserver) new ResizeObserver(fit).observe(paperBox);
  window.addEventListener('resize', fit); fit();
}

/* ---------- boot ---------- */
async function start(hot) {
  try { state.remember = localStorage.getItem(KEY + '.remember') !== '0'; } catch (err) {}
  rememberBtn.setAttribute('aria-pressed', String(state.remember));
  let restored = false;
  if (hot && hot.v === 1) restored = await restore(hot);
  if (!restored && state.remember) {
    try { const raw = localStorage.getItem(KEY); if (raw) restored = await restore(JSON.parse(raw)); } catch (err) {}
  }
  if (!restored) setPage('blank', false);
  markerWEl.value = String(state.markerW); markerAEl.value = String(state.markerA); updateMarkerPreview();
  setColor(state.color); setTool(state.tool);
  undoBtn.disabled = strokes.length === 0;
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(snapshot); } catch (err) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>

</body></html>
